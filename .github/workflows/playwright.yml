name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 8 * * *' # Runs daily at 08:15 AM
  
  # Manual Trigger with Environment Selection
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environment to test'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
      grep_tags:
        description: 'Run only tests with tag (e.g. @smoke)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Setup Node.js & Cache (Speed Boost)
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # 2. Lint Check (Uses your new 'npm run lint' script)
    - name: Run Lint Check
      run: npm run lint

    # 3. Install Browsers
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 4. Run Tests
    # This step connects the GitHub dropdown choice to your playwright.config.ts
    - name: Run Playwright tests
      run: npx playwright test ${{ inputs.grep_tags }}
      env:
        # Pass the selected environment to the config
        ENV: ${{ inputs.target_env || 'qa' }} 
        # Pass secrets if your tests need them (configure in GitHub Settings)
        # TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        CI: true

    # 5. Upload Report (Zip)
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # 6. Publish to GitHub Pages (Live Website)
    - name: Deploy Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        keep_files: true